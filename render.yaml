services:
  - type: web
    name: kingsoft-stockflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: STOCKFLOW_SECURE_COOKIES
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
