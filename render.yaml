services:
  - type: web
    name: kingsoft-stockflow
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: STOCKFLOW_SECURE_COOKIES
        value: "true"
      - key: STOCKFLOW_DATA_DIR
        value: /data
    disk:
      name: stockflow-data
      mountPath: /data
      sizeGB: 1
